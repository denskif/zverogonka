  <style>
    .leg-a,.arm-b{transform-origin:57px 89px;animation:swing-a .38s ease-in-out infinite alternate}
    .leg-b,.arm-a{transform-origin:57px 89px;animation:swing-b .38s ease-in-out infinite alternate}
    .arm-a,.arm-b{transform-origin:62px 64px}
    .cape{transform-origin:52px 61px;animation:cape-wave .4s ease-in-out infinite alternate}
    @keyframes swing-a{to{transform:rotate(34deg)}}@keyframes swing-b{to{transform:rotate(-34deg)}}@keyframes cape-wave{to{transform:skewY(-7deg)}}
    @media(prefers-reduced-motion:reduce){.leg-a,.leg-b,.arm-a,.arm-b,.cape{animation:none}}
  </style>
